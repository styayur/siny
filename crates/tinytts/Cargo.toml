[package]
name = "tinytts"
version = "0.1.0"
edition = "2021"
description = "Tiny, offline text-to-speech for Windows (Kokoro + sherpa-onnx)"
license = "GPL-3.0-or-later"
repository = "https://github.com/styayur/TinyTTS"
readme = "README.md"

[[bin]]
name = "TinyTTS"
path = "src/main.rs"

[[example]]
name = "native_model_acceptance"
required-features = ["native"]

[features]
default = ["gui"]
# The `gui` feature enables the desktop app; `native` enables only the TTS/audio runtime.
# Disable both to run the
# dependency-light core unit tests without a C toolchain or the sherpa-onnx
# native library:
#
#     cargo test --no-default-features
native = ["dep:sherpa-onnx", "dep:rodio", "dep:windows-sys", "dep:clipboard-win"]
gui = ["native", "dep:eframe", "dep:rfd"]

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
sherpa-onnx = { workspace = true, optional = true }
# Keep the existing OpenGL renderer; 0.37 changes its default to WGPU.
eframe = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }
rfd = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "=5.4.3", optional = true }
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

