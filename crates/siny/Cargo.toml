[package]
name = "siny"
version = "0.1.0-alpha.2"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/styayur/siny"
[features]
default = ["gui"]
sherpa = ["tinystt/native", "tinytts/native", "dep:sherpa-onnx", "dep:windows-sys"]
gui = ["sherpa", "dep:eframe", "dep:rfd", "dep:tray-icon"]
[dependencies]
sherpa-onnx = { workspace = true, optional = true }
rfd = { version = "0.18", optional = true }
tray-icon = { version = "0.26", default-features = false, optional = true }
siny-core = { path = "../siny-core" }
tinystt = { path = "../tinystt", default-features = false }
tinytts = { path = "../tinytts", default-features = false }
eframe = { workspace = true, optional = true }
serde.workspace = true
toml.workspace = true
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
[[bin]]
name = "siny"
path = "src/main.rs"
[[example]]
name = "acceptance"
required-features = ["sherpa"]

[[example]]
name = "devices"
required-features = ["gui"]

[[example]]
name = "clipboard"
required-features = ["gui"]
