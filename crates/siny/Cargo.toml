[package]
name = "siny"
version = "0.1.0-alpha.1"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/styayur/siny"
[features]
default = ["gui"]
sherpa = ["tinystt/native", "tinytts/native", "dep:sherpa-onnx"]
gui = ["sherpa", "dep:eframe", "dep:rfd"]
[dependencies]
sherpa-onnx = { workspace = true, optional = true }
rfd = { version = "0.17", optional = true }
siny-core = { path = "../siny-core" }
tinystt = { path = "../tinystt", default-features = false }
tinytts = { path = "../tinytts", default-features = false }
eframe = { workspace = true, optional = true }
serde.workspace = true
toml.workspace = true
[[bin]]
name = "siny"
path = "src/main.rs"
[[example]]
name = "acceptance"
required-features = ["sherpa"]

[[example]]
name = "devices"
required-features = ["gui"]
