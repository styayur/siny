name: Qualified Windows release
on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful Siny validation main push run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: siny-windows-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact main qualification, corresponding source and download verification
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: python scripts/release_windows.py --run $env:QUALIFICATION_RUN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            work/release/*/SHA256SUMS.txt
            work/release/*/verification.json
            work/release/*/release-notes.md
          if-no-files-found: warn
