version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: fortnightly
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: fortnightly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
